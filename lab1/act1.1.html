<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectEd - IT Support Sim</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; text-align: center; }
        #map-container { background: #2c3e50; padding: 50px; margin: 20px auto; width: 80%; border-radius: 12px; display: flex; justify-content: center; }
        .office { background: #ecf0f1; width: 120px; height: 120px; margin: 0 20px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: black; font-weight: bold;}
        .led { width: 15px; height: 15px; border-radius: 50%; position: absolute; top: 10px; right: 10px; background: green; }
        .led.broken { background: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        #ui-panel { background: #333; padding: 20px; width: 60%; margin: 0 auto; border: 2px solid gold; border-radius: 12px; }
        input { padding: 10px; width: 60%; margin-top: 10px; background: #222; color: white; border: 1px solid green; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <h1>ConnectEd - IT Support Sim</h1>
        <div class="stats">XP: <span id="xp">0</span> | Level: <span id="level">1</span></div>
        
        <div id="map-container">
            <div id="office-row"></div>
        </div>

        <div id="ui-panel" style="display:none;">
            <h3 id="office-title">Office 1</h3>
            <p id="problem-desc">Loading issue...</p>
            <input type="text" id="cmd-input" placeholder="Enter command...">
            <button id="run-btn">Run Command</button>
            <button id="hint-btn">Hint</button>
            <pre id="feedback" style="color: #00ff41; background: black; padding: 10px; margin-top: 10px; text-align: left;"></pre>
        </div>
    </div>

    <script>
        let player = { totalXP: 0, level: 1 };
        let offices = [];
        let currentOffice = null;

        const problems = [
            { prob: "PC keeps saying 'Request Timed Out'", sol: "ping 192.168.1.1" },
            { prob: "Users report very slow internet speeds", sol: "show interfaces" },
            { prob: "The wireless access point is not broadcasting the SSID", sol: "no shutdown" }
        ];

        function generateMap() {
            const row = document.getElementById('office-row');
            row.innerHTML = '';
            offices = []; // Reset offices
            for (let i = 1; i <= 3; i++) {
                const issue = problems[Math.floor(Math.random() * problems.length)];
                const office = { name: `Office ${i}`, problem: issue.prob, solution: issue.sol, fixed: false };
                offices.push(office);

                const div = document.createElement('div');
                div.className = 'office';
                div.innerHTML = `<span>🖥️</span><div class="led broken"></div>`;
                div.onclick = () => enterOffice(office);
                row.appendChild(div);
            }
        }

        function enterOffice(office) {
            if (office.fixed) return;
            currentOffice = office;
            document.getElementById('ui-panel').style.display = 'block';
            document.getElementById('office-title').innerText = `🛠️ Help Desk: ${office.name}`;
            document.getElementById('problem-desc').innerText = office.problem;
            document.getElementById('feedback').innerText = '';
            document.getElementById('cmd-input').value = '';
        }

        function runCommand() {
            const input = document.getElementById('cmd-input').value.trim();
            const feedback = document.getElementById('feedback');
            if (input.toLowerCase() === currentOffice.solution.toLowerCase()) {
                currentOffice.fixed = true;
                player.totalXP += 70;
                player.level = Math.floor(player.totalXP / 200) + 1;
                document.getElementById('xp').innerText = player.totalXP;
                document.getElementById('level').innerText = player.level;
                feedback.innerText = "✅ Ticket Resolved! +70 XP!";
                setTimeout(() => {
                    document.getElementById('ui-panel').style.display = 'none';
                    generateMap(); // Refresh the map so the lights go away
                }, 2000);
            } else {
                feedback.innerText = `❌ Incorrect. Try typing: ${currentOffice.solution}`;
            }
        }

        document.getElementById('run-btn').onclick = runCommand;
        document.getElementById('cmd-input').addEventListener("keypress", function(event) {
            if (event.key === "Enter") { runCommand(); }
        });
        document.getElementById('hint-btn').onclick = () => {
            document.getElementById('feedback').innerText = `💡 Hint: Try typing the command: ${currentOffice.solution}`;
        };

        // Start the game
        generateMap();
    </script>
</body>
</html>
